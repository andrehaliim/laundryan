  <circle cx="70" cy="31.5" r="1.5" fill="#94A3B8" />
  <circle cx="76" cy="31.5" r="1.5" fill="#94A3B8" />
  <circle cx="82" cy="31.5" r="1.5" fill="#22C55E" />
  <circle cx="64" cy="68" r="26" fill="#F8FAFC" stroke="#034078" stroke-width="3.5" />
  <circle cx="64" cy="68" r="20" fill="url(#drumGlass)" stroke="#38BDF8" stroke-width="1.5" />
  <path d="M49 68C52 64 56 64 59 67C62 70 66 70 70 66C74 62 78 63 80 65" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
